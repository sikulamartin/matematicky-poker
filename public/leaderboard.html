<!DOCTYPE html>
<html lang="cs" data-theme="academism">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Žebříček nejlepších hráčů matematického pokeru — dnes, tento týden, tento měsíc a celkově.">
  <meta name="color-scheme" content="light dark">
  <title>Žebříček — Matematický Poker</title>
  <link rel="icon" type="image/x-icon" href="img/image_Kv_uh2AR_1719232116258_512.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@200..700&family=Roboto:wght@400;500;700&family=Schibsted+Grotesk:wght@400..900&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script>
    // motiv se nasadí ještě před vykreslením, aby stránka neproblikla
    (function () {
      try {
        var t = localStorage.getItem('mp-theme');
        if (t === 'papir' || t === 'anthropic') { t = 'academism'; }
        if (t === 'studio') { t = 'terminal'; }
        if (t === 'noc') { t = 'legacy'; }
        if (t !== 'terminal' && t !== 'academism' && t !== 'legacy') { t = 'academism'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage nedostupný */ }
    })();
  </script>
</head>

<body>
  <script src="js/icons.js"></script>
  <div class="app">
    <header class="rail">
      <nav class="crumbs" aria-label="Drobečková navigace">
        <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>Domů</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb-current" aria-current="page">Žebříček</span>
      </nav>
      <div class="rail-actions">
        <a class="btn btn--ghost" href="ranked.html">Hrát o žebříček</a>
        <div data-theme-switch></div>
      </div>
    </header>

    <main class="app-main app-main--top">
      <div class="hero">
        <h1 class="hero-title"><span class="quiet">Nejlepší</span>hráči</h1>
        <!-- Nezlomitelné mezery po jednopísmenných předložkách a spojkách —
             česká sazba je nenechává viset na konci řádku. -->
        <p class="hero-sub">
          Do tabulky jdou jen partie odehrané v&nbsp;režimu <a href="ranked.html">o&nbsp;žebříček</a>,
          kde karty rozdává a&nbsp;body počítá server. Z&nbsp;každého hráče se drží
          jediný nejlepší výsledek.
        </p>
      </div>

      <section class="block" aria-labelledby="boardHead">
        <div class="section-head">
          <h2 class="section-title" id="boardHead">Pořadí</h2>
          <span class="section-meta" id="boardMeta">–</span>
        </div>

        <div class="tabs" role="tablist" aria-label="Období žebříčku">
          <button type="button" class="tab" role="tab" data-period="day" aria-selected="false">
            Dnes
          </button>
          <button type="button" class="tab" role="tab" data-period="week" aria-selected="false">
            Tento týden
          </button>
          <button type="button" class="tab" role="tab" data-period="month" aria-selected="false">
            Tento měsíc
          </button>
          <button type="button" class="tab" role="tab" data-period="all" aria-selected="true">
            Celkově
          </button>
        </div>

        <div id="boardHost" aria-live="polite">
          <p class="list-empty">Načítám žebříček…</p>
        </div>
      </section>

      <p class="foot-note">
        Pořadí i&nbsp;skóre vznikají na serveru, ne v&nbsp;prohlížeči.
        <a href="privacy.html">Co se odesílá</a>
      </p>
    </main>
  </div>

  <script src="shared/rules.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/consent.js"></script>
  <script src="js/store.js"></script>
  <script src="js/account.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/api.js"></script>
  <script src="js/leaderboard.js"></script>
</body>

</html>
