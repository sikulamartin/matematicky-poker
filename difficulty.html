<!DOCTYPE html>
<html lang="cs" data-theme="academism">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Vyber obtížnost matematického pokeru — lehká bez času, těžká s odpočtem.">
  <meta name="color-scheme" content="light dark">
  <title>Obtížnost — Matematický Poker</title>
  <link rel="icon" type="image/x-icon" href="img/image_Kv_uh2AR_1719232116258_512.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400..700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;700&family=Oswald:wght@200..700&family=Roboto:wght@400;500;700&family=Schibsted+Grotesk:wght@400..900&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <script>
    // motiv se nasadí ještě před vykreslením, aby stránka neproblikla
    (function () {
      try {
        var t = localStorage.getItem('mp-theme');
        if (t === 'papir' || t === 'anthropic') { t = 'academism'; }
        if (t === 'studio') { t = 'terminal'; }
        if (t === 'noc') { t = 'legacy'; }
        if (t !== 'terminal' && t !== 'academism' && t !== 'legacy') { t = 'academism'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* localStorage nedostupný */ }
    })();
  </script>
</head>

<body>
  <script src="js/icons.js"></script>
  <div class="app">
    <header class="rail">
      <nav class="crumbs" aria-label="Drobečková navigace">
        <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>Domů</a>
        <span class="crumb-sep" aria-hidden="true">/</span>
        <span class="crumb-current" aria-current="page">Hra</span>
      </nav>
      <div class="rail-actions">
        <a class="btn btn--ghost" href="rules.html">Pravidla</a>
        <div data-theme-switch></div>
      </div>
    </header>

    <main class="app-main">
      <div class="hero">
        <h1 class="hero-title"><span class="quiet">Vyber</span>obtížnost</h1>
        <!-- Nezlomitelná mezera po jednopísmenné spojce — česká sazba ji
             nenechává viset na konci řádku. -->
        <p class="hero-sub">Pravidla i&nbsp;bodování jsou stejná. Liší se jen tlak času.</p>
      </div>

      <nav class="menu" aria-label="Obtížnost">
        <a class="menu-item" href="easy.html">
          <span class="menu-icon"><svg class="icon" aria-hidden="true"><use href="#i-gauge"></use></svg></span>
          <span>
            <span class="menu-label">Lehká</span>
            <span class="menu-desc">Bez časomíry. Nad každým tahem se rozmýšlej, jak dlouho chceš.</span>
          </span>
          <span class="menu-arrow"><svg class="icon" aria-hidden="true"><use href="#i-arrowRight"></use></svg></span>
        </a>
        <a class="menu-item" href="hard.html">
          <span class="menu-icon"><svg class="icon" aria-hidden="true"><use href="#i-timer"></use></svg></span>
          <span>
            <span class="menu-label">Těžká</span>
            <span class="menu-desc">Na každé číslo máš zadaný počet sekund. Co nestihneš uložit, propadne.</span>
          </span>
          <span class="menu-arrow"><svg class="icon" aria-hidden="true"><use href="#i-arrowRight"></use></svg></span>
        </a>
      </nav>
    </main>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/consent.js"></script>
  <script src="js/store.js"></script>
  <script src="js/account.js"></script>
  <script src="js/nav.js"></script>
</body>

</html>
